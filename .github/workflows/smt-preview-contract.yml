name: SMT Premium UI Preview Contract

on:
  push:
    branches:
      - integration/smt-replit-portability-20261116
      - feature/smt-multisheet-preview-20261116
      - feature/smt-single-owner-auth-20261116
      - feature/smt-import-validation-20261116
  pull_request:
    paths:
      - 'vercel.json'
      - 'scripts/verify-smt-preview.mjs'
      - 'scripts/verify-smt-replit-parity.mjs'
      - 'scripts/test-smt-sheet-classification.mjs'
      - 'scripts/test-smt-owner-auth.mjs'
      - 'scripts/check-smt-auth-security.mjs'
      - 'scripts/test-smt-import-validation.mjs'
      - 'scripts/src/test-smt-owner-http.ts'
      - 'scripts/src/test-smt-clinical-postgres.ts'
      - 'scripts/smt-browser-qa.mjs'
      - 'artifacts/api-server/**'
      - 'lib/api-client-react/**'
      - 'artifacts/fiche-medicale/**'
      - '.github/workflows/smt-preview-contract.yml'

permissions:
  contents: read

jobs:
  inspect-preview-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate JavaScript syntax
        run: node --check scripts/verify-smt-preview.mjs
      - name: Check premium UI and Vercel route contract
        run: node scripts/verify-smt-preview.mjs
      - name: Verify exact Replit visual and Word source file hashes
        run: node scripts/verify-smt-replit-parity.mjs
      - name: Exercise Replit sheet classification using synthetic sheet names
        run: node --experimental-strip-types scripts/test-smt-sheet-classification.mjs
      - name: Exercise owner authentication logic (synthetic passwords only)
        run: node --experimental-strip-types --test scripts/test-smt-owner-auth.mjs
      - name: Verify API owner and CSRF guard wiring
        run: node scripts/check-smt-auth-security.mjs
      - name: Test import dry-run dates, IDs and duplicates with synthetic rows
        run: node --experimental-strip-types --test scripts/test-smt-import-validation.mjs
      - name: Validate Vercel JSON
        run: python3 -m json.tool vercel.json > /dev/null

  full-monorepo-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Source-only staging quality gate: never provide DB/API/production secrets.
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.20.0
      - name: Install workspace dependencies from committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Run owner HTTP integration test against isolated Express router
        run: pnpm --filter @workspace/scripts exec tsx src/test-smt-owner-http.ts
      - name: Complete TypeScript workspace typecheck
        run: pnpm run typecheck
      - name: Build all workspace artifacts
        run: pnpm run build

  clinical-synthetic-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Database is a temporary CI service and uses ONLY synthetic records.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smt_test
          POSTGRES_PASSWORD: synthetic_only_test_password
          POSTGRES_DB: smt_clinical_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smt_test -d smt_clinical_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://smt_test:synthetic_only_test_password@127.0.0.1:5432/smt_clinical_test
      NODE_ENV: test
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10.20.0
      - name: Restore locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Create disposable PostgreSQL schema
        run: pnpm --filter @workspace/db exec drizzle-kit push --force --config ./drizzle.config.ts
      - name: Exercise synthetic clinical workflows against disposable PostgreSQL
        run: pnpm --filter @workspace/scripts exec tsx src/test-smt-clinical-postgres.ts

  browser-synthetic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install --global pnpm@10.20.0
          pnpm install --frozen-lockfile
      - name: Build standalone Replit React interface
        run: pnpm --filter @workspace/fiche-medicale run build
      - name: Install pinned browser runner
        run: |
          npm install --prefix /tmp/smt-playwright playwright@1.55.1
          node /tmp/smt-playwright/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test premium navigation and browser runtime with synthetic API responses
        run: |
          PORT=18701 NODE_ENV=production pnpm --filter @workspace/fiche-medicale exec vite preview --host 127.0.0.1 --port 18701 > /tmp/smt-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18701/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smt-browser-qa.mjs
