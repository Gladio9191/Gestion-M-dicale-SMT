name: Gestion Medicale SMT typecheck and build
'on':
  push:
    branches: ["qa/toolkit-2026-11-20", "feature/phase2-date-validation", "audit/security-hardening-20261120"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typescript-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Source-backed API security regression checks
        run: node --test tests/*.test.cjs
      - name: Verify TypeScript types
        run: pnpm run typecheck
      - name: Build workspace
        env:
          PORT: '4173'
          BASE_PATH: '/'
          NODE_ENV: production
        run: pnpm run build

  python-api-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python API module syntax
        run: python -m py_compile artifacts/fiche-engine/app.py artifacts/fiche-engine/request_validation.py artifacts/fiche-engine/security_guards.py
      - name: Install HTTP test dependencies
        run: python -m pip install 'flask>=3,<4' 'flask-cors>=4,<7' 'fpdf2>=2.8,<3'
      - name: Run synthetic year-range regression tests
        run: python -m unittest discover -s artifacts/fiche-engine/tests -p 'test_*.py' -v
