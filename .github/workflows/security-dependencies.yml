name: Dependency security assessment (advisory gate)
'on':
  push:
    branches: ["audit/security-hardening-20261120"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependency vulnerabilities (fails on High/Critical)
        run: pnpm audit --prod --audit-level high
