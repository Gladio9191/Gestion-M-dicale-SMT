name: Refresh security override lockfile on audit branch
'on':
  push:
    branches: ["audit/security-hardening-20261120"]
    paths:
      - pnpm-workspace.yaml
permissions:
  contents: write
jobs:
  refresh-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/security-hardening-20261120
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Regenerate lockfile only from explicit patch overrides
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build workspace
        env:
          PORT: '4173'
          BASE_PATH: '/'
          NODE_ENV: production
        run: pnpm run build
      - name: Save audited dependency lockfile in separate branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(security): lock reviewed transitive dependency patches"
          git push origin HEAD:refs/heads/audit/security-hardening-20261120
